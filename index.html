<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraClicker | Coming Soon</title>
    <style>
        :root {
            --bg-color: #05050a;
            --text-purple: #bd2bf2;
            --text-pink: #f22b9c;
            --text-cyan: #2be6f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Lighting Match */
        .ambient-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(0, 128, 128, 0.12) 0%, transparent 50%);
            filter: blur(60px);
            z-index: 1;
        }

        /* Content Wrapper */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
        }

        /* Sliced Gradient Logo Design */
        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .logo {
            font-size: 5.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Gradient matching your image split */
            background: linear-gradient(to right, 
                var(--text-purple) 0%, 
                var(--text-purple) 35%, 
                var(--text-pink) 35%, 
                var(--text-pink) 60%, 
                var(--text-cyan) 60%, 
                var(--text-cyan) 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(189, 43, 242, 0.4));
            position: relative;
        }

        /* Clean Cinematic Subtitle */
        .subtitle {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 14px;
            text-transform: uppercase;
            color: #8fa0af;
            opacity: 0.8;
            padding-left: 14px; /* Counteracts letter-spacing offset to center perfectly */
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .logo { font-size: 3.2rem; }
            .subtitle { font-size: 0.8rem; letter-spacing: 8px; padding-left: 8px; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <div class="logo-wrapper">
            <h1 class="logo">AuraClicker</h1>
        </div>
        <p class="subtitle">Coming Soon</p>
    </div>

</body>
</html>
