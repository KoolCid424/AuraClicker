<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraClicker⚡ The Aura Grind Never Stops</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0c20;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 32, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1d183a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            max-width: 400px;
            width: 90%;
        }
        .warning-box {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
            display: none;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #4c3e88;
            background: #130f2a;
            color: white;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .game-content {
            filter: blur(5px);
            pointer-events: none;
        }
        .game-content.active {
            filter: none;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Auth Wall Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2>⚡ AURACLICKER LOGIN ⚡</h2>
            <p>You must log in or create an account to start the aura grind.</p>
            
            <!-- Warning message for guest progress -->
            <div id="guestWarning" class="warning-box"></div>

            <input type="email" id="email" placeholder="EMAIL">
            <input type="password" id="password" placeholder="PASSWORD">
            <input type="text" id="playerName" placeholder="PLAYER NAME (new accounts)">
            
            <button onclick="handleAuth('signin')">Sign in</button>
            <button onclick="handleAuth('create')">Create account</button>
            <button onclick="handleAuth('google')" style="background: #fff; color: #000;">Continue with Google</button>
        </div>
    </div>

    <!-- Main Game UI -->
    <div id="gameUI" class="game-content">
        <div class="container">
            <h1>AuraClicker⚡</h1>
            <p>⚠ MAIN CHARACTER SYNDROME DETECTED ⚠</p>
            <h2>THE AURA GRIND NEVER STOPS.</h2>
            <div style="font-size: 24px; margin: 20px 0;">✨ Total aura <strong id="auraCount">0</strong></div>
            <button id="clickBtn" style="font-size: 20px; padding: 20px;" onclick="gainAura()">⚡ GENERATE AURA ⚡</button>
            <p>Next rank: Aura Apprentice</p>
        </div>
    </div>

    <script>
        // Simulate checking for existing guest progress
        // In real app, this would read from localStorage.getItem('aura_guest_save')
        let guestAura = localStorage.getItem('aura_guest_progress') || 420; // Default example value for demonstration

        window.onload = function() {
            if (guestAura && parseInt(guestAura) > 0) {
                const warningDiv = document.getElementById('guestWarning');
                warningDiv.innerText = `You could loose ${guestAura} aura if you do not make an account`;
                warningDiv.style.display = 'block';
            }
        };

        function handleAuth(type) {
            // Authenticate and unlock game
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('gameUI').classList.add('active');
            alert(`Logged in via ${type}! Welcome to the grind.`);
        }

        let aura = 0;
        function gainAura() {
            aura += 1;
            document.getElementById('auraCount').innerText = aura;
        }
    </script>
</body>
</html>
